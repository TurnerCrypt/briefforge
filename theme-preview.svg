 <text x="1096" y="96" text-anchor="end" font-size="12" letter-spacing="2" fill="#9aa5af">THEME STUDY / 03</text>
 <text x="108" y="172" font-size="36" letter-spacing="-1.2" font-weight="600" fill="#f3f1ed">Build it. Don’t miss a requirement.</text>
 <text x="108" y="206" font-size="16" fill="#a9b3bc">Turn a long brief into a checklist you can verify.</text>
